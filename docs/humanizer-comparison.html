<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Korean Humanizer — 비교</title>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #13151c;
      --surface-raised: #1b1e28;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.13);
      --text: #dde1ea;
      --muted: #6b7280;
      --dim: #9ca3af;

      --col-raw: #6b7280;
      --col-raw-bg: rgba(107,114,128,0.1);
      --col-raw-chip: rgba(107,114,128,0.15);

      --col-codex: #3b82f6;
      --col-codex-bg: rgba(59,130,246,0.08);
      --col-codex-chip: rgba(59,130,246,0.15);

      --col-kh: #10b981;
      --col-kh-bg: rgba(16,185,129,0.08);
      --col-kh-chip: rgba(16,185,129,0.15);

      --radius: 12px;
      --radius-sm: 7px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", Pretendard, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(13,15,20,0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6 0%, #10b981 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .header-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--dim);
      font: 12.5px/1 inherit;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
    }

    button:hover { background: var(--surface-raised); color: var(--text); }
    button:focus-visible { outline: 2px solid rgba(59,130,246,0.5); outline-offset: 2px; }

    .status {
      font-size: 12px;
      color: #10b981;
      min-width: 90px;
      text-align: right;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .status.show { opacity: 1; }

    /* ── Main layout ── */
    main {
      padding: 16px 20px 32px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    /* ── Column cards ── */
    .col {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .col:focus-within { border-color: var(--border-strong); }

    .col-raw   { border-top: 2px solid var(--col-raw); }
    .col-codex { border-top: 2px solid var(--col-codex); }
    .col-kh    { border-top: 2px solid var(--col-kh); }

    .col-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 14px 11px;
      border-bottom: 1px solid var(--border);
    }

    .col-raw   .col-head { background: var(--col-raw-bg); }
    .col-codex .col-head { background: var(--col-codex-bg); }
    .col-kh    .col-head { background: var(--col-kh-bg); }

    .col-meta { display: flex; flex-direction: column; gap: 5px; }

    .col-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .col-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .col-raw   .col-dot { background: var(--col-raw); }
    .col-codex .col-dot { background: var(--col-codex); }
    .col-kh    .col-dot { background: var(--col-kh); }

    .col-name {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .col-raw   .chip { background: var(--col-raw-chip);   color: var(--col-raw); }
    .col-codex .chip { background: var(--col-codex-chip); color: #60a5fa; }
    .col-kh    .chip { background: var(--col-kh-chip);    color: #34d399; }

    .copy-btn {
      flex-shrink: 0;
      height: 26px;
      padding: 0 9px;
      font-size: 11.5px;
    }

    textarea {
      display: block;
      flex: 1;
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 420px;
      border: 0;
      resize: none;
      padding: 14px 15px;
      background: transparent;
      color: var(--text);
      font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 12.5px;
      line-height: 1.72;
    }

    textarea:focus { outline: none; }

    textarea::selection {
      background: rgba(59, 130, 246, 0.25);
    }

    /* ── Scrollbar ── */
    textarea::-webkit-scrollbar { width: 5px; }
    textarea::-webkit-scrollbar-track { background: transparent; }
    textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 99px; }

    @media (max-width: 1100px) {
      .grid { grid-template-columns: 1fr; }
      textarea { height: 460px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div class="logo">✦</div>
      <div>
        <div class="header-title">Korean Humanizer — 비교</div>
        <div class="header-sub">원문 · Codex · korean-humanizer 세 버전을 나란히. 클릭해서 편집 가능.</div>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" data-copy-all>전체 Markdown 복사</button>
      <span class="status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:var(--col-raw)"></span>원문</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--col-codex)"></span>Codex 내장</span>
      <span class="legend-item"><span class="legend-dot" style="background:var(--col-kh)"></span>korean-humanizer</span>
    </div>

    <div class="grid">
      <!-- 원문 -->
      <div class="col col-raw">
        <div class="col-head">
          <div class="col-meta">
            <div class="col-label">
              <span class="col-dot"></span>
              <span class="col-name">원문</span>
            </div>
            <span class="chip">사용자 입력 그대로</span>
          </div>
          <button class="copy-btn" type="button" data-copy="original">복사</button>
        </div>
        <textarea id="original" spellcheck="false">맞아요. 다시 보면 "README의 Try It in 30 Seconds를 보완할 수 있는 데모"라는 방향 자체는 좋습니다. 특히 설치 전 체험 입구는 이 프로젝트에 잘 맞아요.

다만 지금 화면/흐름 기준으로는 공식 README에 바로 걸기엔 보완 요청을 먼저 하는 게 맞아 보입니다.

핵심 피드백은 이 정도입니다.

- "초안 입력"이 업로드 중심이면 진입 장벽이 있음. README 예시처럼 텍스트를 바로 붙여넣고 실행할 수 있어야 함.
- 첫 화면의 "I am willing to pay…"는 프로젝트의 첫인상과 조금 다름. korean-humanizer는 가볍게 써보는 prompt/skill이라, 유료 의향 확인이 먼저 나오면 사용자가 이 프로젝트 자체가 유료 서비스처럼 오해할 수 있음.
- 로그인 전에 데모 입력/출력 예시를 볼 수 있으면 좋음.
- 제3자 서비스이므로 사용자 입력 저장 여부, 사용 LLM, 로그 보관, 삭제 방법이 명확해야 함.
- "Unofficial community demo"라는 표시가 필요함.
- 데모가 PROMPT.short.md 기준인지, PROMPT.md 기준인지, 특정 버전/커밋 기준인지 보여주면 좋음.

이슈 답변은 너무 차갑게 "안 됩니다"보다는, 처음 외부에서 관심 가져준 것에 대한 기쁨을 분명히 표현하고, 그 다음 공식 링크로 넣기 위한 조건을 정리하는 게 좋아요.

댓글 초안:

안녕하세요. 먼저 정말 감사합니다.

이 프로젝트를 보고 바로 실행해볼 수 있는 데모까지 만들어주신 게 처음이라, 개인적으로는 꽤 기쁩니다. 아직 작은 prompt/skill 프로젝트인데 누군가 직접 써보고, 더 쉽게 체험할 수 있는 입구를 만들어줬다는 점이 정말 반갑습니다.

방향 자체는 좋아 보입니다. 특히 README의 "Try It in 30 Seconds" 섹션은 지금도 사용자가 `PROMPT.short.md`를 직접 복사해서 써보는 방식이라, 설치 없이 바로 결과를 확인할 수 있는 데모가 있으면 확실히 도움이 될 것 같습니다.

다만 지금 상태에서 공식 README에 바로 연결하기 전에 몇 가지는 보완되면 좋겠습니다.

- 초안 입력이 업로드 중심인 것 같은데, README 예시처럼 텍스트를 바로 붙여넣고 실행할 수 있으면 좋겠습니다.
- 첫 화면의 "I am willing to pay for good AI results" 문구는 이 프로젝트의 첫인상과는 조금 다르게 읽힐 수 있습니다. `korean-humanizer`는 가볍게 써볼 수 있는 prompt/skill이라, 사용자가 유료 서비스나 결제 의향 확인으로 먼저 받아들이지 않았으면 합니다.
- 로그인 전에 짧은 샘플 입력/출력 정도는 볼 수 있으면 좋겠습니다.
- 사용자가 입력한 원문, 출력, 재시도 로그가 저장되는지 궁금합니다. 저장된다면 보관 기간, 삭제 방법, 접근 권한도 같이 안내되면 좋겠습니다.
- 어떤 LLM/provider를 호출하는지, 그리고 `PROMPT.short.md` 기준인지 `PROMPT.md` 기준인지도 표시되면 좋겠습니다.
- 이 데모가 공식 서비스가 아니라 unofficial/community demo라는 점이 페이지 안에서 명확하면 좋겠습니다.
- 민감한 텍스트나 개인정보를 넣지 말라는 안내도 있으면 좋겠습니다.

위 부분들이 정리되면 README 메인에 바로 넣을지, 아니면 `docs/community-demos.md` 같은 문서에 "Unofficial community demo"로 연결할지 검토해보겠습니다.

다시 한 번 감사합니다. 이런 식으로 프로젝트를 실제로 써볼 수 있게 확장해주신 건 정말 반갑고 고맙습니다.

내 추천은 이 댓글을 달고 이슈는 바로 닫지 말고 열어두는 것입니다. 상대가 개선해서 다시 오면 첫 외부 기여/관심으로 이어질 수 있어서요.</textarea>
      </div>

      </div>

        <div class="col-head">
          <div class="col-meta">

              <span class="col-dot"></span>

            </div>
            <span class="chip">의미 보존, 가벼운 터치</span>
          </div>
          <button class="copy-btn" type="button" data-copy="korean">복사</button>

  <script>
    const statusEl = document.querySelector(".status");
    let statusTimer;

    function flash(msg) {
      statusEl.textContent = msg;
      statusEl.classList.add("show");
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => statusEl.classList.remove("show"), 1800);
    }

    async function copyText(text, label) {
      await navigator.clipboard.writeText(text);
      flash(`${label} 복사됨`);
    }

    document.querySelectorAll("[data-copy]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-copy");
        const textarea = document.getElementById(id);
        const name = btn.closest(".col").querySelector(".col-name").textContent;
        copyText(textarea.value, name);
      });
    });

    document.querySelector("[data-copy-all]").addEventListener("click", () => {
      const sections = [
        ["원문", document.getElementById("original").value],
        ["Codex 내장 Humanizer", document.getElementById("codex").value],
        ["korean-humanizer", document.getElementById("korean").value],
      ];
      const markdown = sections
        .map(([title, body]) => `## ${title}\n\n${body}`)
        .join("\n\n---\n\n");
      copyText(markdown, "전체 Markdown");
    });
  </script>
